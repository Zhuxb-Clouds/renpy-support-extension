name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Run Python tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/ -q

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build .vsix
        run: pnpm run vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: pnpm exec vsce publish --no-dependencies

      - name: Warn about missing VSCE_PAT
        if: env.VSCE_PAT == ''
        run: echo "::warning::VSCE_PAT secret is not set; skipped Marketplace publish (GitHub Release only)"

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${TAG_VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG_VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: renpy-support-extension-*.vsix
          body_path: release_notes.md
          fail_on_unmatched_files: true
