[project]
name = "renpy-lsp"
version = "1.6.0"
description = "Language server for Ren'Py script files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lsprotocol>=2025.0.0",
    "pygls>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bundled/tools"]
